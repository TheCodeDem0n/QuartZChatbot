<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat | QuartZ Bot</title>
  <link rel="stylesheet" href="chat.css" />
</head>

<body>

  <!-- Sidebar toggle for mobile -->
  <button id="toggleSidebar" class="sidebar-toggle">☰</button>

  <div class="chat-container">
    
    <!--SIDEBAR-->
    <aside class="sidebar" id="sidebar">

      <!--HEADER -->
      <div class="sidebar-header">
        <button class="btn new-chat" onclick="initNewSessionAndInput()">+ New Chat</button>
      </div>

      <!-- SCROLLABLE MIDDLE -->
      <div class="sidebar-middle">
        <section class="sidebar-section">
          <h3>Current Session</h3>
          <div id="currentSessionContainer" class="session-container"></div>
        </section>

        <section class="sidebar-section">
          <h3>Chat History</h3>
          <div id="historyContainer" class="history-container"></div>
        </section>
      </div>

      <!-- LOGOUT -->
      <button class="btn logout-btn" onclick="logoutUser()">Logout</button>

    </aside>

    <!--MAIN CHAT -->
    <main class="chat-main">
    
      <div id="chatBox" class="chat-box"></div>

      <div class="chat-input">
        <input type="text" id="userMessage" placeholder="Type your message..." />
        <button class="btn" onclick="sendMessage()">Send</button>
      </div>
    </main>

  </div>

  <script src="chat.js"></script>
</body>
</html>
